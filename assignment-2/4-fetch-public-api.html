<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fetch Data from Public API</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #1f2937;
      }

      h1 {
        text-align: center;
      }

      #postContainer {
        max-width: 900px;
        margin: 24px auto 0;
        display: grid;
        gap: 16px;
      }

      .post-card {
        background: #ffffff;
        border-radius: 14px;
        padding: 18px;
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
      }

      .post-card h3 {
        margin-top: 0;
        color: #0f4c81;
      }

      .loading,
      .error {
        text-align: center;
        font-size: 1.05rem;
      }

      .error {
        color: #c1121f;
      }
    </style>
  </head>
  <body>
    <h1>Latest Posts using Fetch API</h1>
    <div id="postContainer">
      <p class="loading">Loading posts...</p>
    </div>

    <script>
      const postContainer = document.getElementById("postContainer");

      fetch("https://jsonplaceholder.typicode.com/posts?_limit=6")
        .then((response) => {
          if (!response.ok) {
            throw new Error("Unable to fetch posts.");
          }
          return response.json();
        })
        .then((posts) => {
          postContainer.innerHTML = "";

          posts.forEach((post) => {
            const postCard = document.createElement("div");
            postCard.className = "post-card";
            postCard.innerHTML = `
              <h3>${post.title}</h3>
              <p>${post.body}</p>
            `;
            postContainer.appendChild(postCard);
          });
        })
        .catch((error) => {
          postContainer.innerHTML = `<p class="error">${error.message}</p>`;
        });
    </script>
  </body>
</html>
